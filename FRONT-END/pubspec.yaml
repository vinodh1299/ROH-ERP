name: roh_erp
description: Ray of Hope Center for Autism - ERP Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  # MySQL direct connection (Flutter)
  # mysql_client: ^0.0.27
  # OR use http + PHP REST API bridge:
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
