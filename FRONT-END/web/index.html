<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ray of Hope Center for Autism - Comprehensive Clinical ERP, VB-MAPP Assessment & Therapy Management System">
  <meta name="keywords" content="Ray of Hope, Autism Center, VB-MAPP, IEP, Therapy Management, ERP, BCBA, Special Education">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ray of Hope Center for Autism - Clinical ERP">
  <meta property="og:description" content="Comprehensive Clinical ERP, VB-MAPP Assessment, IEP Tracking & Therapy Scheduling System.">
  <meta property="og:site_name" content="Ray of Hope ERP">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ROH ERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ray of Hope Center for Autism - Clinical ERP</title>
  <link rel="manifest" href="manifest.json">

  <!-- Anti-caching meta tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script>
    // Force unregister old cached Flutter service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Shared Web Audio context with automated user gesture unlocking
    let _audioCtx = null;
    function getAudioContext() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!_audioCtx) {
          _audioCtx = new AudioCtx();
        }
        if (_audioCtx.state === 'suspended') {
          _audioCtx.resume();
        }
        return _audioCtx;
      } catch (e) {
        return null;
      }
    }

    // Auto unlock on first user interaction anywhere in the window
    function unlockAudio() {
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'running') {
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      }
    }
    window.addEventListener('click', unlockAudio, { passive: true });
    window.addEventListener('keydown', unlockAudio, { passive: true });
    window.addEventListener('touchstart', unlockAudio, { passive: true });

    // Premium dual-tone chime notification sound
    window.playNotificationSound = function() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        // Tone 1: 587.33 Hz (D5) - soft bell attack
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0.001, now);
        gain1.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.4);

        // Tone 2: 880.0 Hz (A5) - bell ring harmonic
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.0, now + 0.09);
        gain2.gain.setValueAtTime(0.001, now + 0.09);
        gain2.gain.exponentialRampToValueAtTime(0.3, now + 0.11);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.09);
        osc2.stop(now + 0.65);

        // Tone 3: 1174.66 Hz (D6) - subtle sparkle finish
        const osc3 = ctx.createOscillator();
        const gain3 = ctx.createGain();
        osc3.type = 'sine';
        osc3.frequency.setValueAtTime(1174.66, now + 0.18);
        gain3.gain.setValueAtTime(0.001, now + 0.18);
        gain3.gain.exponentialRampToValueAtTime(0.2, now + 0.20);
        gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
        osc3.connect(gain3);
        gain3.connect(ctx.destination);
        osc3.start(now + 0.18);
        osc3.stop(now + 0.75);
      } catch (e) {
        console.warn('Notification audio playback error:', e);
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
